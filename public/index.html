<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="./favicon.ico">
    <meta name="description" content="WebSockets Client">
    <meta name="author" content="Oscar Rico">
    <title>WebSockets Client</title>
</head>
<body>
    <h1>Status</h1>
    <p id="status">Connecting</p>

    <button id="btn-disconnect">Disconnect</button>
    <button id="btn-connect">Connect</button>

    <form id="message-form" style="display: none;">
        <h1>Messages</h1>
        <input type="text" id="input-message" placeholder="Message">
        <button id="send">Send</button>
    </form>

    <ul id="messages"></ul>

    <script>
        // Create cookies
        const session = {
            id: 1,
            sessionId: 'Abc123'
        }
        const jwtToken = 'MyToken-JWT';
        document.cookie = `session=${JSON.stringify(session)}`;
        document.cookie = `X-Token=${jwtToken}`;

        let socket;

        
        const status = document.getElementById("status");
        const btnDisconnect = document.getElementById("btn-disconnect");
        const btnConnect = document.getElementById("btn-connect");
        const messageForm = document.getElementById("message-form");
        const messageInput = document.getElementById("input-message");
        const btnSend = document.getElementById("send");
        const messagesContainer = document.getElementById("messages");

        const createWebSocket = () => {
            const channelId = 'my-channel-personalized';

            const socket = new WebSocket(`ws://localhost:3001?channelId=${channelId}`);
            
            socket.onopen = () => {
                console.log("Connected to server!");
    
                messageForm.style.display = "block";
    
                status.textContent = "Connected!";
            }
    
            socket.onclose = () => {
                console.log("Disconnected from server");
    
                messageForm.style.display = "none";
                status.textContent = "Disconnected";
            };
    
            socket.onerror = (error) => {
                console.error("Error: ", error);
    
                status.textContent = "Error";
            };

            socket.onmessage = (event) => {
                console.log(event.data);
                showMessage(event.data);
            }

            return socket;
        }

        socket = createWebSocket();


        btnDisconnect.addEventListener('click', () => {
            if (socket.readyState !== WebSocket.OPEN) return;

            socket.close();
        })

        btnConnect.addEventListener('click', () => {
            if (socket.readyState === WebSocket.OPEN) return;

            socket = createWebSocket();
        })

        messageForm.addEventListener('submit', (event) => {
            event.preventDefault();

            if(!messageInput.value && messageInput.length === 0) return;

            socket.send(messageInput.value);
            //showMessage(messageInput.value);
            messageInput.value = '';
        })

        const showMessage = (message) => {
            const li = document.createElement('li');
            li.textContent = message;
            messagesContainer.appendChild(li);
        }
    </script>
</body>
</html>
